<template>
    <!-- Rendered as plain content. The Quick Action supplies the modal chrome (panel,
         header, close button), so this component must NOT build its own — doing that
         nests a modal inside a modal and leaves white bands above and below. -->
    <div class="psm-root">

        <template if:true={isLoading}>
            <div class="slds-is-relative psm-loading">
                <lightning-spinner alternative-text="Loading the schedule" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>

            <div class="psm-body">

                <template if:true={hasError}>
                    <div class="psm-alert psm-alert-error" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error"
                            class="slds-m-right_x-small"></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>
                </template>

                <template if:false={editingEnabled}>
                    <div class="psm-alert psm-alert-warning" role="alert">
                        <span>This booking is read-only. Ask your administrator to change the schedule edit mode.</span>
                    </div>
                </template>

                <template if:true={hasSchedules}>

                    <!-- The one number to drive to zero -->
                    <template if:true={isProrata}>
                        <div class={meterClass}>
                            <div class="alloc-main">
                                <span class="alloc-value">{remainingText}</span>
                                <span class="alloc-sub">
                                    Bank Payable {sumBankText} of {loanSanctionedText} sanctioned
                                </span>
                            </div>
                            <div class="alloc-actions">
                                <lightning-button label="Spread across milestones" variant="neutral"
                                    onclick={handleDistribute} disabled={isSaving}></lightning-button>
                                <lightning-button label="Clear all" variant="neutral"
                                    class="slds-m-left_x-small" onclick={handleClearAll}
                                    disabled={isSaving}></lightning-button>
                                <template if:true={isDirty}>
                                    <lightning-button label="Undo changes" variant="neutral"
                                        class="slds-m-left_x-small" onclick={handleDiscard}
                                        disabled={isSaving}></lightning-button>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Booking context -->
                    <div class="psm-stats">
                        <div class="psm-stat">
                            <span class="psm-stat-label">Funding Type</span>
                            <span class="psm-stat-value">{fundingType}</span>
                        </div>
                        <div class="psm-stat">
                            <span class="psm-stat-label">Grand Total</span>
                            <span class="psm-stat-value">{grandTotalText}</span>
                        </div>
                        <template if:true={isProrata}>
                            <div class="psm-stat psm-stat-bank">
                                <span class="psm-stat-label">Loan Sanctioned · Bank</span>
                                <span class="psm-stat-value">{loanSanctionedText}</span>
                            </div>
                            <div class="psm-stat psm-stat-cust">
                                <span class="psm-stat-label">Deficit · Customer</span>
                                <span class="psm-stat-value">{deficitText}</span>
                            </div>
                        </template>
                        <div class="psm-stat">
                            <span class="psm-stat-label">TDS · Customer</span>
                            <span class="psm-stat-value">{totalTdsText}</span>
                        </div>
                    </div>

                    <!-- Live reconciliation -->
                    <template if:true={isProrata}>
                        <div class="recon-panel">
                            <div class="recon-row">
                                <span class="recon-item">
                                    Bank Payable
                                    <span class={bankClass}>{sumBankText}</span>
                                    <span class="recon-of">of {loanSanctionedText}</span>
                                </span>
                                <template if:true={isStrictProrata}>
                                    <span class="recon-item">
                                        Customer Payable
                                        <span class={custClass}>{sumCustText}</span>
                                        <span class="recon-of">of {effectiveDeficitText}</span>
                                    </span>
                                </template>
                            </div>
                            <p class="recon-note">
                                TDS of {totalTdsText} is payable by the customer and sits outside the split.
                                <template if:true={hasLockedUnsplit}>
                                    Demand-raised milestones carry no split, so {lockedUnsplitTotalText} is
                                    already settled and the Deficit target drops to {effectiveDeficitText}.
                                </template>
                            </p>
                        </div>
                    </template>

                    <!-- What is stopping the send -->
                    <template if:true={hasIssues}>
                        <div class="issue-panel" role="alert">
                            <h3 class="issue-head">
                                <lightning-icon icon-name="utility:warning" size="x-small" variant="error"
                                    class="slds-m-right_x-small"></lightning-icon>
                                {issueHeading}
                            </h3>
                            <ul class="issue-list">
                                <template for:each={issues} for:item="issue">
                                    <li key={issue.key}>
                                        <button type="button" class="issue-link" data-key={issue.key}
                                            onclick={handleIssueClick}>
                                            <strong>{issue.label}</strong> — {issue.message}
                                        </button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>

                    <!-- One card per milestone -->
                    <div class="ms-list">
                        <template for:each={schedules} for:item="sch">
                            <div key={sch.id} data-card={sch.id} class={sch.cardClass}>

                                <div class="ms-card-head">
                                    <div class="ms-title">
                                        <span class="ms-seq">{sch.sequence}</span>
                                        <span class="ms-name">{sch.milestoneName}</span>
                                        <template if:true={sch.cannotEdit}>
                                            <span class="ms-lock">
                                                <lightning-icon icon-name="utility:lock" size="xx-small"
                                                    class="slds-m-right_xx-small"></lightning-icon>
                                                {sch.lockReason}
                                            </span>
                                        </template>
                                    </div>
                                    <div class="ms-head-right">
                                        <template if:true={sch.showBalance}>
                                            <span class={sch.balanceClass}>{sch.balanceText}</span>
                                        </template>
                                        <span class={sch.statusClass}>{sch.status}</span>
                                        <template if:true={sch.canEdit}>
                                            <lightning-button-menu alternative-text="Milestone actions"
                                                icon-size="x-small" menu-alignment="right" variant="bare">
                                                <lightning-menu-item value="fill"
                                                    label="Put the rest of the loan here"
                                                    data-id={sch.id} onclick={handleFillRemaining}>
                                                </lightning-menu-item>
                                                <lightning-menu-item value="cust" label="Move all to customer"
                                                    data-id={sch.id} onclick={handleAllToCustomer}>
                                                </lightning-menu-item>
                                            </lightning-button-menu>
                                        </template>
                                    </div>
                                </div>

                                <!-- Read-only context, set when the schedule was generated -->
                                <div class="ms-basics">
                                    <div class="ms-field">
                                        <label>Percentage</label>
                                        <span class="ms-ro">{sch.percentageText}</span>
                                    </div>
                                    <div class="ms-field">
                                        <label>Base (Flat)</label>
                                        <span class="ms-ro">{sch.baseText}</span>
                                    </div>
                                    <div class="ms-field">
                                        <label>GST</label>
                                        <span class="ms-ro">{sch.gstText}</span>
                                    </div>
                                    <div class="ms-field">
                                        <label>TDS</label>
                                        <span class="ms-ro ms-ro-muted">{sch.tdsText}</span>
                                    </div>
                                    <div class="ms-field">
                                        <label>Total</label>
                                        <span class="ms-ro psm-total">{sch.amountText}</span>
                                    </div>
                                    <div class="ms-field">
                                        <label>Pending</label>
                                        <span class="ms-ro psm-pending">{sch.pendingText}</span>
                                    </div>
                                </div>

                                <template if:true={isProrata}>
                                    <div class="ms-bifurcation">

                                        <div class="biforc-box biforc-bank">
                                            <div class="biforc-head">
                                                <lightning-icon icon-name="utility:company" size="x-small"></lightning-icon>
                                                Bank Payable
                                                <span class="biforc-sum">{sch.bankPayableText}</span>
                                            </div>
                                            <div class="biforc-fields">
                                                <div class="biforc-field">
                                                    <label>
                                                        Flat
                                                        <template if:true={sch.flatAutoOnBank}>
                                                            <span class="ms-auto">auto</span>
                                                        </template>
                                                    </label>
                                                    <template if:true={sch.canEdit}>
                                                        <lightning-input type="number" step="0.01"
                                                            value={sch.bankFlat} data-id={sch.id}
                                                            data-field="bankFlat" onchange={handleFieldChange}
                                                            variant="label-hidden" class={sch.bankFlatClass}>
                                                        </lightning-input>
                                                    </template>
                                                    <template if:false={sch.canEdit}>
                                                        <span class="ms-ro">{sch.bankFlatText}</span>
                                                    </template>
                                                </div>
                                                <div class="biforc-field">
                                                    <label>
                                                        GST
                                                        <template if:true={sch.gstAutoOnBank}>
                                                            <span class="ms-auto">auto</span>
                                                        </template>
                                                    </label>
                                                    <template if:true={sch.canEdit}>
                                                        <lightning-input type="number" step="0.01"
                                                            value={sch.bankGst} data-id={sch.id}
                                                            data-field="bankGst" onchange={handleFieldChange}
                                                            variant="label-hidden" class={sch.bankGstClass}>
                                                        </lightning-input>
                                                    </template>
                                                    <template if:false={sch.canEdit}>
                                                        <span class="ms-ro">{sch.bankGstText}</span>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="biforc-box biforc-customer">
                                            <div class="biforc-head">
                                                <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                                Customer Payable
                                                <span class="biforc-sum">{sch.customerPayableText}</span>
                                            </div>
                                            <div class="biforc-fields">
                                                <div class="biforc-field">
                                                    <label>
                                                        Flat
                                                        <template if:true={sch.flatAutoOnCustomer}>
                                                            <span class="ms-auto">auto</span>
                                                        </template>
                                                    </label>
                                                    <template if:true={sch.canEdit}>
                                                        <lightning-input type="number" step="0.01"
                                                            value={sch.customerFlat} data-id={sch.id}
                                                            data-field="customerFlat" onchange={handleFieldChange}
                                                            variant="label-hidden" class={sch.customerFlatClass}>
                                                        </lightning-input>
                                                    </template>
                                                    <template if:false={sch.canEdit}>
                                                        <span class="ms-ro">{sch.customerFlatText}</span>
                                                    </template>
                                                </div>
                                                <div class="biforc-field">
                                                    <label>
                                                        GST
                                                        <template if:true={sch.gstAutoOnCustomer}>
                                                            <span class="ms-auto">auto</span>
                                                        </template>
                                                    </label>
                                                    <template if:true={sch.canEdit}>
                                                        <lightning-input type="number" step="0.01"
                                                            value={sch.customerGst} data-id={sch.id}
                                                            data-field="customerGst" onchange={handleFieldChange}
                                                            variant="label-hidden" class={sch.customerGstClass}>
                                                        </lightning-input>
                                                    </template>
                                                    <template if:false={sch.canEdit}>
                                                        <span class="ms-ro">{sch.customerGstText}</span>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <template if:true={sch.hasIssue}>
                                        <div class="ms-card-issue">
                                            <lightning-icon icon-name="utility:error" size="xx-small"
                                                variant="error" class="slds-m-right_xx-small"></lightning-icon>
                                            {sch.issueText}
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasSchedules}>
                    <p class="psm-empty">
                        This booking has no payment schedule yet. Generate the schedule before splitting it.
                    </p>
                </template>
            </div>

            <!-- Sticky action bar. Not a modal footer — it rides the bottom of the content. -->
            <div class="psm-actions">
                <template if:true={showConfirmClose}>
                    <span class="psm-confirm">
                        Close without sending? Your changes will be lost.
                    </span>
                    <lightning-button label="Keep editing" variant="neutral"
                        class="slds-m-right_x-small" onclick={handleCancelClose}></lightning-button>
                    <lightning-button label="Discard and close" variant="destructive"
                        onclick={handleConfirmClose}></lightning-button>
                </template>

                <template if:false={showConfirmClose}>
                    <span class="psm-note">{footerNote}</span>
                    <lightning-button label="Close" variant="neutral" class="slds-m-right_x-small"
                        onclick={handleClose}></lightning-button>
                    <lightning-button label="Send for approval" variant="brand"
                        onclick={handleSave} disabled={saveDisabled}></lightning-button>
                </template>
            </div>
        </template>
    </div>
</template>
