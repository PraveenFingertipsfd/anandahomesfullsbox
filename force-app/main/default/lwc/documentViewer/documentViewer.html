<template>
    <div class="viewer-container">
        <!-- Header -->
        <div class="viewer-header">
            <div class="viewer-header-left">
                <div class="viewer-icon-wrap">
                    <lightning-icon icon-name="standard:document" size="small"></lightning-icon>
                </div>
                <div class="viewer-title-wrap">
                    <h2 class="viewer-title">{cardTitle}</h2>
                    <template if:true={hasTemplates}>
                        <span class="viewer-count">{templateCount} template{pluralSuffix}</span>
                    </template>
                </div>
            </div>
            <lightning-button-icon icon-name="utility:refresh"
                alternative-text="Refresh" onclick={handleRefresh}
                variant="bare" size="medium" class="viewer-refresh"></lightning-button-icon>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="viewer-loading">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <!-- Error (templates) -->
        <template if:true={error}>
            <div class="viewer-error">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span>{error}</span>
            </div>
        </template>

        <template if:false={isLoading}>
            <!-- Preview Panel (shared by templates and VF pages) -->
            <template if:true={showPreview}>
                <div class="preview-panel">
                    <div class="preview-header">
                        <div class="preview-header-left">
                            <template if:true={previewIsPdf}>
                                <lightning-icon icon-name="doctype:pdf" size="x-small"></lightning-icon>
                            </template>
                            <template if:false={previewIsPdf}>
                                <lightning-icon icon-name="standard:visualforce_page" size="x-small"></lightning-icon>
                            </template>
                            <span class="preview-doc-title">{previewDocName}</span>
                        </div>
                        <div class="preview-header-right">
                            <template if:true={previewIsPdf}>
                                <lightning-button-icon icon-name="utility:download"
                                    alternative-text="Download" data-url={previewPdfUrl}
                                    onclick={handleDownloadPdf} variant="border-filled"
                                    size="small" tooltip="Download PDF"></lightning-button-icon>
                            </template>
                            <template if:false={previewIsPdf}>
                                <lightning-button-icon icon-name="utility:new_window"
                                    alternative-text="Open in new tab" data-url={previewUrl}
                                    onclick={handleOpenVfPage} variant="border-filled"
                                    size="small" tooltip="Open in new tab"></lightning-button-icon>
                            </template>
                            <lightning-button-icon icon-name="utility:close"
                                alternative-text="Close preview" onclick={handleClosePreview}
                                variant="border-filled" size="small"></lightning-button-icon>
                        </div>
                    </div>
                    <div class="preview-body">
                        <iframe src={previewUrl} class="preview-iframe" title="Document Preview"></iframe>
                    </div>
                </div>
            </template>

            <template if:false={showPreview}>

                <!-- ==================== SECTION 1: DOCUMENT TEMPLATES ==================== -->
                <template if:true={hasTemplates}>
                    <div class="section-header">
                        <lightning-icon icon-name="standard:document" size="x-small"></lightning-icon>
                        <span class="section-title">Document Templates</span>
                        <span class="section-count">{templateCount}</span>
                    </div>

                    <div class={containerClass}>
                        <template for:each={templates} for:item="doc">

                            <!-- LIST LAYOUT -->
                            <template if:true={isListLayout}>
                                <div key={doc._key} class="doc-item" data-id={doc.id}>
                                    <div class="doc-item-left">
                                        <div class="doc-icon-circle">
                                            <lightning-icon icon-name="doctype:pdf" size="x-small"></lightning-icon>
                                        </div>
                                        <div class="doc-item-info">
                                            <span class="doc-item-name" title={doc.name}>{doc.name}</span>
                                            <template if:true={doc._hasDescription}>
                                                <span class="doc-item-desc">{doc.description}</span>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="doc-item-actions-always">
                                        <button class="doc-btn doc-btn-view" data-url={doc.viewUrl}
                                            data-pdf={doc.pdfUrl} data-name={doc.name}
                                            onclick={handlePreviewPdf} title="Preview">
                                            <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                            <span>View</span>
                                        </button>
                                        <button class="doc-btn doc-btn-download" data-url={doc.pdfUrl}
                                            onclick={handleDownloadPdf} title="Download PDF">
                                            <lightning-icon icon-name="doctype:pdf" size="xx-small"></lightning-icon>
                                            <span>PDF</span>
                                        </button>
                                        <button class="doc-btn doc-btn-word" data-url={doc.wordUrl}
                                            data-name={doc.name} onclick={handleViewWord} title="View Word">
                                            <lightning-icon icon-name="doctype:word" size="xx-small"></lightning-icon>
                                            <span>Word</span>
                                        </button>
                                        <button class="doc-btn doc-btn-download" data-url={doc.wordUrl}
                                            onclick={handleDownloadWord} title="Download Word">
                                            <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                                        </button>
                                        <button class="doc-btn doc-btn-email" data-id={doc.id}
                                            data-name={doc.name} onclick={handleSendEmail} title="Send Email">
                                            <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                                            <span>Email</span>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- GRID LAYOUT -->
                            <template if:true={isGridLayout}>
                                <div key={doc._key} class="doc-card" data-id={doc.id}>
                                    <div class="doc-card-top">
                                        <div class="doc-card-icon-wrap">
                                            <lightning-icon icon-name="doctype:pdf" size="medium"></lightning-icon>
                                        </div>
                                        <div class="doc-card-badge">PDF</div>
                                    </div>
                                    <div class="doc-card-body">
                                        <span class="doc-card-name">{doc.name}</span>
                                        <template if:true={doc._hasDescription}>
                                            <span class="doc-card-desc">{doc.description}</span>
                                        </template>
                                    </div>
                                    <div class="doc-card-footer-split">
                                        <button class="doc-card-action" data-url={doc.viewUrl}
                                            data-pdf={doc.pdfUrl} data-name={doc.name}
                                            onclick={handlePreviewPdf} title="Preview">
                                            <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                            <span>View</span>
                                        </button>
                                        <button class="doc-card-action" data-url={doc.pdfUrl}
                                            onclick={handleDownloadPdf} title="Download PDF">
                                            <lightning-icon icon-name="doctype:pdf" size="xx-small"></lightning-icon>
                                            <span>PDF</span>
                                        </button>
                                        <button class="doc-card-action" data-url={doc.wordUrl}
                                            data-name={doc.name} onclick={handleViewWord} title="Download / View Word">
                                            <lightning-icon icon-name="doctype:word" size="xx-small"></lightning-icon>
                                            <span>Word</span>
                                        </button>
                                        <button class="doc-card-action" data-id={doc.id}
                                            data-name={doc.name} onclick={handleSendEmail} title="Send Email">
                                            <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                                            <span>Email</span>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- COMPACT LAYOUT -->
                            <template if:true={isCompactLayout}>
                                <div key={doc._key} class="doc-compact-item" data-url={doc.viewUrl}
                                     data-pdf={doc.pdfUrl} data-name={doc.name} onclick={handlePreviewPdf} title={doc.name}>
                                    <lightning-icon icon-name="doctype:pdf" size="xx-small"></lightning-icon>
                                    <span>{doc.name}</span>
                                </div>
                            </template>

                        </template>
                    </div>
                </template>

                <!-- ==================== SECTION 2: VISUALFORCE PAGES ==================== -->
                <template if:true={showVfSection}>
                    <div class="section-header section-header-vf">
                        <lightning-icon icon-name="standard:visualforce_page" size="x-small"></lightning-icon>
                        <span class="section-title">Visualforce Pages</span>
                        <span class="section-count">{vfPageCount}</span>
                    </div>

                    <!-- VF-specific error -->
                    <template if:true={vfError}>
                        <div class="viewer-error">
                            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                            <span>{vfError}</span>
                        </div>
                    </template>

                    <template if:true={hasVfPages}>
                        <div class="doc-list">
                            <template for:each={vfPages} for:item="page">
                                <div key={page._key} class="doc-item vf-item" data-id={page.id}>
                                    <div class="doc-item-left">
                                        <div class="doc-icon-circle vf-icon-circle">
                                            <lightning-icon icon-name="standard:visualforce_page" size="x-small"></lightning-icon>
                                        </div>
                                        <div class="doc-item-info">
                                            <span class="doc-item-name" title={page.name}>{page.label}</span>
                                            <template if:true={page._hasDescription}>
                                                <span class="doc-item-desc">{page.description}</span>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="doc-item-actions-always">
                                        <button class="doc-btn doc-btn-view" data-url={page.url}
                                            data-name={page.label} onclick={handlePreviewVfPage} title="Preview">
                                            <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                            <span>View</span>
                                        </button>
                                        <button class="doc-btn doc-btn-download" data-page={page.name}
                                            data-name={page.label} onclick={handlePdfVfPage}
                                            title="Download PDF" disabled={isWordGenerating}>
                                            <lightning-icon icon-name="doctype:pdf" size="xx-small"></lightning-icon>
                                            <span>PDF</span>
                                        </button>
                                        <button class="doc-btn doc-btn-word" data-page={page.name}
                                            data-name={page.label} onclick={handleWordVfPage}
                                            title="Download as Word" disabled={isWordGenerating}>
                                            <lightning-icon icon-name="doctype:word" size="xx-small"></lightning-icon>
                                            <span>Word</span>
                                        </button>
                                        <button class="doc-btn doc-btn-email" data-page={page.name}
                                            data-name={page.label} onclick={handleEmailVfPage} title="Send Email">
                                            <lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>
                                            <span>Email</span>
                                        </button>
                                        <button class="doc-btn doc-btn-open" data-url={page.url}
                                            onclick={handleOpenVfPage} title="Open in new tab">
                                            <lightning-icon icon-name="utility:new_window" size="xx-small"></lightning-icon>
                                            <span>Open</span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>

                <!-- Empty state (only when neither section has content) -->
                <template if:true={hasNoContent}>
                    <template if:false={error}>
                        <div class="viewer-empty">
                            <div class="viewer-empty-icon">
                                <lightning-icon icon-name="utility:file" size="large"></lightning-icon>
                            </div>
                            <p class="viewer-empty-title">No Documents</p>
                            <p class="viewer-empty-desc">No document templates or related pages available for this record.</p>
                        </div>
                    </template>
                </template>

            </template>
        </template>

        <!-- Embedded email composer (driven by the per-document "Email" action) -->
        <c-email-sender embedded record-id={recordId} object-api-name={objectApiName}></c-email-sender>
    </div>
</template>
